---
- name: Launch proxy
  community.docker.docker_container:
    name: httpd
    image: "{{ docker_hub_user }}/tp-devops-httpd:latest"
    pull: true
    state: started
    restart_policy: unless-stopped
    networks:
      - name: app-network
    ports:
      - "80:80"
- name: Copy httpd proxy config
  copy:
    src: httpd.conf
    dest: /opt/httpd.conf

- name: Run HTTPD proxy container
  docker_container:
    name: httpd
    image: httpd:alpine
    networks:
      - name: app-network
    ports:
      - "80:80"
    volumes:
      - /opt/httpd.conf:/usr/local/apache2/conf/httpd.conf
    state: started
    pull: true