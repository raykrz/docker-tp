# Workflow 3: deploy to the server with Ansible
# Starts only when "Build and Push Docker Images" has finished, and only if it succeeded
name: Deploy

on:
  workflow_run:
    # Must match EXACTLY the "name:" of workflow 2
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible

      - name: Install community.docker collection
        run: ansible-galaxy collection install community.docker

      # Private key -> temp file, server fingerprint -> known_hosts (both from secrets)
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # --private-key overrides the local path written in the inventory
      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventories/setup.yml \
            playbook.yml \
            --private-key "$RUNNER_TEMP/deploy_key"
