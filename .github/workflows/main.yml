# Name shown in the GitHub "Actions" tab
name: CI devops 2025

# WHEN the pipeline runs
on:
  push:
    branches:
      - main
      - develop
  pull_request:

# WHAT the pipeline does
jobs:
  # Job 1: build the backend and run its tests
  test-backend:
    # GitHub gives us a fresh Ubuntu computer for this job
    runs-on: ubuntu-24.04
    steps:
      # Download our repo code onto that computer
      - uses: actions/checkout@v4

      # Install Java 21 (Temurin) and cache Maven downloads to go faster next time
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile + run unit and integration tests
      # (testcontainers starts a temporary Postgres, Docker is already installed on the runner)
      # then send the code analysis to SonarCloud.
      # Project key and organization come from repository variables (Settings > Secrets and variables > Actions > Variables);
      # the token stays a secret.
      - name: Build, test and analyze with SonarCloud
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          --file ./simple-api/pom.xml

  # Job 2: build the 3 Docker images and push them to Docker Hub
  build-and-push-docker-image:
    # Wait for test-backend to succeed first; if tests fail, this job doesn't run
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      # Download the code again (each job gets a fresh computer)
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub using the secrets (never written in plain text)
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Build the backend image from simple-api/Dockerfile
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # Build on every branch, but only PUSH when we're on main
          push: ${{ github.ref == 'refs/heads/main' }}

      # Same for the database
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Same for httpd
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}